<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_19 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Ultra-smooth, non-flickering ambient 3D geometric node lattice background
// Designed specifically for high-contrast, clean technical UI (Kuber OS style)
(function() {
  const container = document.currentScript ? document.currentScript.parentElement : (window.container || document.body);
  
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.set(0, 0, 32);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0); // completely transparent
  
  container.style.position = 'relative';
  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.top = '0';
  renderer.domElement.style.left = '0';
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
  renderer.domElement.style.pointerEvents = 'none';
  renderer.domElement.style.zIndex = '0';
  
  container.appendChild(renderer.domElement);

  // Group to gently rotate and float
  const networkGroup = new THREE.Group();
  scene.add(networkGroup);

  // Create an elegant, delicate constellation/lattice of nodes & connections
  // Perfect for verification/blockchain/intelligence network visualization
  const particleCount = 75;
  const radius = 18;
  const coords = [];
  
  const pGeometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  // Precision cyan/slate palette matching Design System 3 (#0284c7, #38bdf8, #94a3b8)
  const color1 = new THREE.Color(0x0284c7); // Primary precision blue
  const color2 = new THREE.Color(0x38bdf8); // Sky blue
  const color3 = new THREE.Color(0xcbd5e1); // Soft slate

  for (let i = 0; i < particleCount; i++) {
    // Distribute nicely in an open, organic toroidal/ellipsoidal volume
    const u = Math.random();
    const v = Math.random();
    const theta = u * 2.0 * Math.PI;
    const phi = Math.acos(2.0 * v - 1.0);
    const r = Math.cbrt(Math.random()) * radius * 0.9 + 4.0;
    
    const x = r * Math.sin(phi) * Math.cos(theta) * 1.5;
    const y = r * Math.sin(phi) * Math.sin(theta) * 0.85;
    const z = r * Math.cos(phi) * 0.7;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    coords.push(new THREE.Vector3(x, y, z));

    // Subtle varying soft opacity/color
    const mixRatio = Math.random();
    const c = mixRatio > 0.6 ? color1 : (mixRatio > 0.3 ? color2 : color3);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  pGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  pGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Circular point texture for anti-aliased soft glowing dots
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
  gradient.addColorStop(0, 'rgba(2, 132, 199, 1)');
  gradient.addColorStop(0.35, 'rgba(56, 189, 248, 0.7)');
  gradient.addColorStop(0.7, 'rgba(56, 189, 248, 0.15)');
  gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(32, 32, 30, 0, Math.PI * 2);
  ctx.fill();

  const texture = new THREE.CanvasTexture(canvas);
  
  const pMaterial = new THREE.PointsMaterial({
    size: 0.9,
    vertexColors: true,
    map: texture,
    transparent: true,
    opacity: 0.42,
    depthWrite: false,
    blending: THREE.NormalBlending
  });

  const pointsMesh = new THREE.Points(pGeometry, pMaterial);
  networkGroup.add(pointsMesh);

  // Dynamic connecting lines between proximate nodes
  const lineMaterial = new THREE.LineBasicMaterial({
    color: 0x0284c7,
    transparent: true,
    opacity: 0.13,
    depthWrite: false,
    blending: THREE.NormalBlending,
    linewidth: 1
  });

  const linePositions = [];
  const maxDistance = 7.5;

  for (let i = 0; i < particleCount; i++) {
    for (let j = i + 1; j < particleCount; j++) {
      const dist = coords[i].distanceTo(coords[j]);
      if (dist < maxDistance) {
        linePositions.push(coords[i].x, coords[i].y, coords[i].z);
        linePositions.push(coords[j].x, coords[j].y, coords[j].z);
      }
    }
  }

  const lineGeometry = new THREE.BufferGeometry();
  lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
  const lineMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
  networkGroup.add(lineMesh);

  // Subtle floating geometric wireframe prism rings symbolizing cryptographic integrity
  const ringGeo = new THREE.IcosahedronGeometry(11, 1);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x0284c7,
    wireframe: true,
    transparent: true,
    opacity: 0.045
  });
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  networkGroup.add(ringMesh);

  const ringGeo2 = new THREE.TorusGeometry(14, 0.04, 8, 48);
  const ringMat2 = new THREE.MeshBasicMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0.07
  });
  const ringMesh2 = new THREE.Mesh(ringGeo2, ringMat2);
  ringMesh2.rotation.x = Math.PI / 3;
  networkGroup.add(ringMesh2);

  // Smooth mouse interpolation (no jumpy movements, purely subtle parallax)
  let mouseX = 0;
  let mouseY = 0;
  let targetX = 0;
  let targetY = 0;

  function onMouseMove(event) {
    targetX = ((event.clientX / window.innerWidth) - 0.5) * 1.5;
    targetY = ((event.clientY / window.innerHeight) - 0.5) * 1.5;
  }
  window.addEventListener('mousemove', onMouseMove, { passive: true });

  // Resize handler
  function onResize() {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize, { passive: true });

  // Clean, consistent requestAnimationFrame loop with steady delta
  let clock = new THREE.Clock();
  let reqId;

  function animate() {
    reqId = requestAnimationFrame(animate);

    const elapsedTime = clock.getElapsedTime();
    
    // Very slow, deliberate, non-flickering continuous drift
    networkGroup.rotation.y = elapsedTime * 0.028;
    networkGroup.rotation.x = Math.sin(elapsedTime * 0.015) * 0.12;
    ringMesh.rotation.z = elapsedTime * 0.018;
    ringMesh2.rotation.y = elapsedTime * 0.022;

    // Smooth subtle camera easing towards target
    mouseX += (targetX - mouseX) * 0.04;
    mouseY += (targetY - mouseY) * 0.04;

    camera.position.x = mouseX * 2.2;
    camera.position.y = -mouseY * 1.8;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  animate();

  // Teardown hook
  window.__fc_three_cleanup = function() {
    cancelAnimationFrame(reqId);
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('resize', onResize);
    renderer.dispose();
  };
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_19 -->
</body>
</html>
